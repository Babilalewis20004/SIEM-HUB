# Serves the built SPA and reverse-proxies API/WebSocket traffic to the
# backend service so the browser only ever talks to one origin (the axios
# client uses baseURL: "/api" and socket.io-client connects to "/" -- see
# src/api/client.js and src/services/websocket.js). Mirrors the same
# hardening headers vite.config.js applies for the dev/preview servers, since
# vite's config doesn't reach whatever actually serves the production build.
# The Host header is client-controlled, so forwarding it (or $host, which
# just derives from it) verbatim to the backend lets a request with an
# arbitrary Host reach it as if legitimate. This is only ever published as
# http://localhost:8080 (see README), and the in-container healthcheck also
# targets that same port -- allow-list exactly that and reject anything else
# instead of trusting the raw header.
map $http_host $allowed_host {
    default          "";
    "localhost:8080"  $http_host;
}

# Only forward a WebSocket upgrade when the client actually asked for one.
# Blindly relaying $http_upgrade/"Connection: upgrade" for any value (e.g.
# "h2c") lets a request smuggle an HTTP/2-cleartext upgrade past this proxy
# straight to the backend.
map $http_upgrade $upgrade_header {
    default    "";
    websocket  websocket;
}

map $upgrade_header $connection_header {
    websocket  upgrade;
    default    close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    if ($allowed_host = "") {
        return 444;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $allowed_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived WebSocket upgrade -- see app/__init__.py's async_mode note on
    # why the backend runs threading mode, not eventlet/gevent.
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $upgrade_header;
        proxy_set_header Connection $connection_header;
        proxy_set_header Host $allowed_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
