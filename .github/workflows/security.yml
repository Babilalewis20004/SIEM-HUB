name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catch newly-disclosed CVEs in already-committed dependencies, not just
    # ones introduced by a new push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    name: Backend (bandit + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Dependency vulnerabilities (pip-audit)
        run: python -m pip_audit -r requirements.txt

      - name: Static analysis (bandit)
        run: python -m bandit -r app config.py run.py seed.py -ll

  frontend-security:
    name: Frontend (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Semgrep scan
        run: |
          # unvalidated-password is a Django-specific rule that pattern-matches
          # any `.set_password(...)` call by name; it fires on our Flask
          # User.set_password (app/models/user.py) even though the length
          # check happens beforehand (routes/auth.py) and its autofix
          # suggests a nonexistent django.contrib import for this codebase.
          #
          # The two nginx rules below are syntactic (no real config-flow
          # analysis of nginx `map` directives): they flag any occurrence of
          # $host/$http_host in the file -- including inside the `map` block
          # that sanitizes it -- and any proxy_http_version 1.1 + Upgrade/
          # Connection combination regardless of what the mapped values
          # actually resolve to. frontend/nginx.conf already implements the
          # exact mitigation each rule asks for: an explicit Host allow-list
          # (map $http_host $allowed_host, rejecting anything but the
          # documented localhost/localhost:8080 deployment with `return 444`)
          # and an Upgrade header restricted to the literal value "websocket"
          # (map $http_upgrade $upgrade_header) to prevent h2c smuggling.
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/flask \
            --config=p/react \
            --exclude-rule python.django.security.audit.unvalidated-password.unvalidated-password \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --exclude-rule generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling \
            --error

  trivy:
    name: Dependency & config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # v0.28.0 is broken -- its composite action pins aquasecurity/setup-trivy@v0.2.1,
      # a tag since deleted upstream. v0.36.0 pins that internal dependency to a SHA
      # instead of a tag, so it isn't exposed to this.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  dast-zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          # Ephemeral SQLite DB built straight from models, same as pytest
          # (see README) -- skips `flask db upgrade` for a throwaway CI DB.
          AUTO_CREATE_DB: "true"
          # Skip the Werkzeug reloader (see run.py) -- it re-runs create_app()
          # in a forked child, roughly doubling startup time for no benefit
          # in a one-shot CI run.
          FLASK_DEBUG: "false"
        run: |
          python run.py > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 1
          done
          echo "::error::Backend never became healthy -- log follows"
          cat /tmp/backend.log
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "http://localhost:5000"
          fail_action: true
          # See .zap/rules.tsv for why rule 10049 is the one alert ignored here.
          rules_file_name: ".zap/rules.tsv"
          # Job only has `contents: read` -- without this the action tries
          # to file/update a GitHub issue with the report anyway and fails
          # noisily on the 403 on top of the real (fail_action) failure.
          allow_issue_writing: false
